name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n init-project-memory.sh
          bash -n bootstrap.sh
          bash -n templates/codex-stack.sh
          bash -n templates/codex-stack-doctor.sh

      - name: Validate Codex skills and agents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          skills = [
              Path("templates/skills/forge-reviewed-change/SKILL.md"),
              Path("templates/skills/forge-project-build/SKILL.md"),
          ]
          for path in skills:
              text = path.read_text()
              assert text.startswith("---\n"), f"{path}: missing YAML front matter"
              front = text.split("---\n", 2)[1]
              assert "name:" in front, f"{path}: missing name"
              assert "description:" in front, f"{path}: missing description"

          agents = [
              Path("templates/agents/forge-reviewer-medium.toml"),
              Path("templates/agents/forge-adversary-medium.toml"),
              Path("templates/agents/forge-architect-high.toml"),
          ]
          for path in agents:
              with path.open("rb") as handle:
                  data = tomllib.load(handle)
              for key in ("name", "description", "developer_instructions", "model", "model_reasoning_effort", "sandbox_mode"):
                  assert data.get(key), f"{path}: missing {key}"
              assert data["model"] == "gpt-6-luna", f"{path}: unexpected model"
              assert data["sandbox_mode"] == "read-only", f"{path}: reviewer must stay read-only"
          PY

      - name: Validate project-memory bootstrap
        run: |
          tmpdir="$(mktemp -d)"
          bash ./init-project-memory.sh "$tmpdir"
          test -f "$tmpdir/.codex-memory/PROJECT.md"
          test -f "$tmpdir/.codex-memory/DECISIONS.md"
          test -f "$tmpdir/.codex-memory/TASKS.md"
          test -f "$tmpdir/.codex-memory/SESSION.md"
          test -f "$tmpdir/AGENTS.md"
