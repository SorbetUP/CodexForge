name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n init-project-memory.sh
          bash -n bootstrap.sh
          bash -n templates/*.sh
          bash -n scripts/*.sh
          bash -n tests/e2e/*.sh
      - name: Validate Node syntax
        run: |
          node --check bin/codex-forge
          node --check optimizer/server.mjs
          node --check optimizer/tool-result-aging.mjs
          node --check scripts/context-audit.mjs
          node --check scripts/benchmark-live-ab.mjs
      - name: Validate project-memory bootstrap
        run: |
          tmpdir="$(mktemp -d)"
          bash ./init-project-memory.sh "$tmpdir"
          test -f "$tmpdir/.codex-memory/PROJECT.md"
          test -f "$tmpdir/.codex-memory/DECISIONS.md"
          test -f "$tmpdir/.codex-memory/TASKS.md"
          test -f "$tmpdir/.codex-memory/SESSION.md"
          test -f "$tmpdir/AGENTS.md"
      - name: Run deterministic user-equivalent suite
        run: bash scripts/test-all.sh
      - name: Run synthetic token-efficiency benchmark
        run: node scripts/benchmark-aging.mjs
